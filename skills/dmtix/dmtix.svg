<text x="57" y="992" font-size="28" font-weight="bold" fill="#111111">Engine</text>
<text x="190" y="992" font-size="21" font-family="Consolas, 'JetBrainsMono NF', 'Liberation Mono', monospace" fill="#b45309">~/.claude/skills/ticks/</text>
<text x="57" y="1018" font-size="19" fill="#55555a">go hands over to the ticks skill. All the loop logic lives there, not in dmtix. One engine per machine.</text>
